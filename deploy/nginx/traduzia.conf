# traduzia.com.br — vhost do quark-nginx (VPS 187.77.195.108).
#
# Três peças:
#   /            → hub (container na própria VPS): serve a página e o acervo
#   /api/hub/…   → hub: lista e assina os arquivos direto do R2
#   /n/desktop/… → desktop do Felipe   (Tailscale 100.98.187.95:8010)
#   /n/mac/…     → MacBook M5 Pro      (Tailscale 100.67.176.89:8010)
#
# O hub é a única peça que precisa estar sempre ligada: com desktop e Mac
# desligados o site abre, você entra e baixa o que já foi traduzido — só não dá
# para enviar artigo novo, porque a tradução vive nas máquinas.
#
# O prefixo /n/<id>/ é removido antes do repasse (proxy_pass terminando em "/"),
# então o backend dos nós não sabe em que caminho é servido.
#
# Instalação: copiar para /root/quark/nginx/conf.d/traduzia.conf e recarregar o
# quark-nginx. Requer o certificado já emitido (antes disso, usar o
# traduzia.http-only.conf ao lado, senão o nginx não sobe).
#
# ATENÇÃO: o quark-nginx roda em container, então "localhost" aqui NÃO é a VPS.
# O hub é alcançado pelo nome do container, o que exige que os dois estejam na
# mesma rede Docker (ver deploy/hub/docker-compose.yml). Confirme o nome da rede
# do quark com: docker inspect quark-nginx -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'

# HTTP: desafio ACME + redireciona para HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name traduzia.com.br www.traduzia.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name traduzia.com.br www.traduzia.com.br;

  ssl_certificate /etc/letsencrypt/live/traduzia.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/traduzia.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # uploads de PDF — mesmo limite do backend
  client_max_body_size 200m;

  # configuração de proxy comum a todos os locations abaixo
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 3s;   # máquina desligada tem que falhar rápido
  proxy_read_timeout 90;
  proxy_send_timeout 300;     # upload de 200 MB atravessando o tailnet
  proxy_redirect off;

  # o proxy LLM é interno de cada nó — nunca exposto na internet.
  # a variante com prefixo vem primeiro (regex ganha de location por prefixo),
  # senão /n/desktop/llmproxy/ contornaria o bloqueio abaixo.
  location ~ ^/n/[^/]+/llmproxy/ {
    return 403;
  }
  location /llmproxy/ {
    return 403;
  }

  # nó desktop (RTX 3050)
  location /n/desktop/ {
    proxy_pass http://100.98.187.95:8010/;
  }

  # nó mac (MacBook M5 Pro)
  location /n/mac/ {
    proxy_pass http://100.67.176.89:8010/;
  }

  # hub: a página, o favicon e a API do acervo
  location / {
    proxy_pass http://traduzia-hub:8020;
  }
}
